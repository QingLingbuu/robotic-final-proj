task_name: dual_arm_robocasa_reach_grasp
backend: robocasa
policy:
  topology: shared_dual_arm_policy
  shared_policy: true
observation:
  source: privileged_state
  fields:
    - robot0_eef_pos
    - robot1_eef_pos
    - robot0_eef_quat
    - robot1_eef_quat
    - robot0_gripper_qpos
    - robot1_gripper_qpos
    - target_object_pos
    - target_handle_left_pos
    - target_handle_right_pos
    - dual_arm_alignment_error
action:
  type: dual_arm_delta_pose_plus_gripper
  dimensions: 8
reward:
  coefficients:
    approach_target: 1.0
    alignment_error_reduction: 1.0
    successful_close: 2.0
    successful_lift: 3.0
    collision_penalty: -2.0
    timeout_penalty: -0.5
termination:
  max_steps: 150
  success_conditions:
    - both_grippers_closed_on_target
    - object_lifted_above_threshold
  failure_conditions:
    - collision
    - timeout
    - object_drop
metrics:
  primary: success_rate
  report:
    - success_rate
    - episode_return
    - episode_length
    - collision_count
    - failure_modes_triggered
train:
  smoke_steps: 8
  checkpoint_every: 4
eval:
  seed_set:
    - 7
    - 11
    - 42
  episodes: 3
artifacts:
  root_dir: .sisyphus/artifacts/rl
  checkpoint_dir: checkpoints
  metrics_dir: metrics
render:
  enabled: false
  mode: human
