backend: grounding_dino
model_id: IDEA-Research/grounding-dino-tiny
device: cpu
local_files_only: true
box_threshold: 0.35
text_threshold: 0.25
target_labels:
  - pot
  - object
  - cube
obstacle_labels:
  - cup
  - bottle
  - bowl
  - can
  - block
max_obstacles: 16
depth_sample_radius: 2
publish_period_sec: 0.2
initial_publish_timeout_sec: 30.0
dual_grasp_lateral_offset: 0.065
dual_grasp_height_offset: -0.04
single_grasp_z_offset: -0.04
single_vision_grasp_offset:
  - 0.09
  - -0.08
  - 0.06
use_sim_height_correction: true
sim_xy_correction_alpha: 0.75
dual_grasp_axis: y

candidate_types:
  - top_down
  - handle_grasp
  - handle_top_down
default_gripper_width: 0.04
handle_gripper_width: 0.03
handle_labels:
  - cup
  - mug
handle_min_points: 8
handle_radial_ratio: 0.15
handle_radial_offset: 0.01
handle_side_band_fraction: 0.25
handle_bbox_padding_fraction: 0.15
handle_height_quantiles:
  - 0.25
  - 0.85
handle_width_margin: 0.01
handle_width_min: 0.02
handle_top_down_inset: 0.0
handle_top_down_surface_quantile: 0.60
handle_top_down_penetration_offset: 0.008
handle_top_down_width_margin: 0.008
handle_top_down_width_min: 0.015
handle_top_down_width_max: 0.08
top_down_surface_quantile: 0.85
top_down_penetration_offset: 0.01
top_down_width_margin: 0.01
top_down_width_min: 0.04
