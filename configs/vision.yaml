backend: grounding_dino
model_id: IDEA-Research/grounding-dino-tiny
device: cpu
local_files_only: true
box_threshold: 0.35
text_threshold: 0.25
target_labels:
  - pot
  - object
  - cube
obstacle_labels:
  - cup
  - bottle
  - bowl
  - can
  - block
max_obstacles: 16
depth_sample_radius: 2
