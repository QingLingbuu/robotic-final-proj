initial_publish_timeout_sec: 30.0
dual_grasp_lateral_offset: 0.065
dual_grasp_height_offset: -0.04
single_grasp_z_offset: -0.04
single_vision_grasp_offset:
  - 0.09
  - -0.08
  - 0.06
use_sim_height_correction: true
sim_xy_correction_alpha: 0.75
dual_grasp_axis: y
